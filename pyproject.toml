[project]
name = "citegraph"
version = "0.1.0"
description = "Read-only MCP server that indexes git repos into a code graph and answers with evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Brian Rankin" }]
keywords = ["mcp", "code-graph", "ai-agents", "tree-sitter", "claude"]
dependencies = [
  "click>=8.5",
  "mcp>=2.2,<3",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "tree-sitter>=0.26",
  "tree-sitter-c-sharp>=0.23.5",
  "tree-sitter-python>=0.25",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.9"]

[project.scripts]
citegraph = "citegraph.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citegraph"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format owns line length; long regex and SQL literals stay on one line

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
