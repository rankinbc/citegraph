- id: citegraph-leak-scan
  name: citegraph leak scan
  description: Block commits that contain secret-shaped values
  entry: citegraph leak-scan --fail-on-findings
  language: python
  types: [text]
  exclude: '(^|/)(uv\.lock|poetry\.lock|Pipfile\.lock|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock)$'
