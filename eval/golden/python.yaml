# Level-1 golden set for the pinned Python corpus (eval/corpus.yaml: flask 3.1.3, httpx 0.28.1).
#
# Bootstrapped from scip-python 0.6.6 output at the pinned shas and verified against source by an agent
# (no human review). Every expected entry was checked by opening the source at the referencing line.
#
# Labeling rules, fixed before citegraph was run on these questions:
# - Subjects are library definitions (src/flask/, httpx/), taken in sha256 hash order from the SCIP
#   reference pool; callers and callees may live anywhere in the repo (library, tests, examples).
# - what_calls: a caller counts when a line inside it calls or instantiates the target with call syntax,
#   including through an import alias, a re-export or an attribute whose static type resolves to the
#   target. Bare decorators (`@name`), callbacks passed without a call, type annotations, isinstance
#   checks, subclassing and calls through a class-valued attribute (`self.response_class(...)`) do not.
#   Dispatch is static: `self.m()` resolves to the class the checker sees, not to subclass overrides.
#   Untyped pytest fixtures are typed from their fixture definition (flask's `app` fixture is a Flask).
#   SCIP misses such calls, so every textual `name(` site in the repo was also read and classified.
#   Targets with more than 15 true callers are not used (httpx Response and Client were dropped).
# - what_does_it_call: every in-corpus function, method or class the body calls or instantiates.
#   Standard library and third-party calls are excluded, and property reads are not calls. Calls in a
#   nested def belong to the nested def; calls in a lambda belong to the enclosing named function.
# - find_config_key: a location counts when the line reads the key (os.environ.get / os.environ[...] /
#   `in os.environ`, a config attribute bound to the key name) or sets or clears it (config-file entry,
#   os.environ assignment, monkeypatch setenv/setitem, a test fixture's table of variables it resets,
#   config.update / from_mapping keywords, module or class attributes loaded by from_object).
#   Docstrings, comments and assertions on message text do not count.
# - find_path: the expected chain is the unique shortest call path in the verified graph; each hop is a
#   verified caller pair.
# - ci: true on questions 1, 4, 7, ... of each tool, in file order.

