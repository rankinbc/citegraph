# Fake secrets for redaction tests. Values are joined from `parts` at load time.

[[case]]
kind = "aws-access-key"
parts = ["AKIA", "Q7XJ2MZ4PLW9RT3K"]
must_match = true

[[case]]
kind = "github-token"
parts = ["ghp_", "aB3dE5fG7hJ9kL1mN3", "pQ5rS7tU9vW1xY3zA5"]
must_match = true

[[case]]
kind = "slack-token"
parts = ["xoxb-", "1234567890-abcdefghij"]
must_match = true

[[case]]
kind = "openai-key"
parts = ["sk-proj-", "Zq8Wn3Lx5Vb7Nm2Kc4Hj6Gf"]
must_match = true

[[case]]
kind = "anthropic-key"
parts = ["sk-ant-", "api03-Zq8Wn3Lx5Vb7Nm2Kc4Hj6Gf"]
must_match = true

[[case]]
kind = "jwt"
parts = ["eyJhbGciOiJIUzI1NiJ9", ".eyJzdWIiOiIxMjM0In0", ".Qm9ndXNTaWduYXR1cmVYWQ"]
must_match = true

[[case]]
kind = "private-key"
parts = [
    "-----BEGIN RSA ",
    "PRIVATE KEY-----\n",
    "MIIBOgIBAAJBAKj34GkxFh",
    "D90vcNLYLInFEX6Ppy1tPf",
    "9Cnzj4p4WGeKLs1Pt8Qu",
    "\n-----END RSA ",
    "PRIVATE KEY-----",
]
must_match = true

[[case]]
kind = "connstr-credential"
parts = ["Server=db;Database=app;User Id", "=admin;", "Password", "=", "Hunter2Secret!"]
must_match = true

[[case]]
kind = "high-entropy"
parts = ["Zx9", "Qw7Er5Ty3Ui1Op0As8Df6Gh4Jk2Lm"]
must_match = true

# Near misses: must pass through unchanged.

[[case]]
kind = "git-sha"
parts = ["3f786850e387550fdab836ed7e6dc881de23001b"]
must_match = false

[[case]]
kind = "blake2b-hash"
parts = ["9b71d224bd62f3785d96d46ad3ea3d73319bfbc2890caadae2dff72519673ca7"]
must_match = false

[[case]]
kind = "uuid"
parts = ["123e4567-e89b-12d3-a456-426614174000"]
must_match = false

[[case]]
kind = "long-identifier"
parts = ["test_parse_config_with_nested_sections_2"]
must_match = false

[[case]]
kind = "qualified-name"
parts = ["flask.sansio.scaffold.Scaffold._get_exc_class_and_code"]
must_match = false

[[case]]
kind = "short-sk"
parts = ["sk-short"]
must_match = false

[[case]]
kind = "short-akia"
parts = ["AKIA1234"]
must_match = false

[[case]]
kind = "password-prose"
parts = ["the password field is required"]
must_match = false

[[case]]
kind = "empty-password"
parts = ["Password=;"]
must_match = false
